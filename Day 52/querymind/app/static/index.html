<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueryMind</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1>QueryMind</h1>
      <p class="tagline">Ask your data a question. Get the SQL instantly.</p>
    </header>

    <section class="card">
      <label for="schema-input">1. Paste your database schema</label>
      <textarea id="schema-input" rows="8" placeholder="CREATE TABLE customers (id INT, name TEXT, region TEXT);"></textarea>

      <label for="question-input">2. Ask your question in plain English</label>
      <textarea id="question-input" rows="2" placeholder="e.g. show total sales by region last quarter"></textarea>

      <button id="generate-btn">Generate SQL</button>

      <p class="disclaimer">AI-generated — please review before running.</p>

      <p id="error-message" class="error-message" style="display: none;"></p>
    </section>

    <section id="result-section" class="card result-card" style="display: none;">
      <h2>Generated SQL</h2>
      <pre id="sql-output"></pre>
      <button id="copy-btn">Copy SQL</button>
      <span id="copy-confirmation" class="copy-confirmation" style="display: none;">Copied!</span>

      <h2>What this query does</h2>
      <p id="explanation-output"></p>

      <p id="warning-output" class="warning-message" style="display: none;"></p>
    </section>
  </main>

  <footer class="app-footer">
    Built with Claude as part of the AB Talks 60-Day Claude AI Challenge.
  </footer>

  <script src="/js/script.js"></script>
</body>
</html>
